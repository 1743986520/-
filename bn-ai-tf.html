<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - SVG 动画</title>
<dl>
  <dt><style></dt>
  <dd>root {</dd>
</dl>

      --sky-top: #7ed7ff;
      --sky-bottom: #eafaff;
      --grass: #74c95f;
      --road: #4a5660;
      --road-line: #fff5ae;
      --ink: #263238;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      font-family: system-ui, sans-serif;
    }

    svg {
      width: min(100vw, 1100px);
      height: auto;
      display: block;
    }

    /* 场景向左滚动，营造前进感 */
    .landscape {
      animation: scroll-landscape 5s linear infinite;
    }

    .road-dashes {
      animation: scroll-road 0.55s linear infinite;
    }

    /* 车轮和脚踏 */
    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.75s linear infinite;
    }

    .crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.75s linear infinite;
    }

    /* 鹈鹕身体的轻微上下起伏 */
    .pelican {
      transform-box: fill-box;
      transform-origin: center;
      animation: bob 0.75s ease-in-out infinite;
    }

    /* 翅膀随骑行摆动 */
    .wing {
      transform-box: fill-box;
      transform-origin: 85% 30%;
      animation: wing-pump 0.75s ease-in-out infinite;
    }

    /* 腿交替踩踏 */
    .leg-front {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: pedal-front 0.75s linear infinite;
    }

    .leg-back {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: pedal-back 0.75s linear infinite;
    }

    /* 嘴袋轻微晃动 */
    .pouch {
      transform-box: fill-box;
      transform-origin: 20% 35%;
      animation: pouch-sway 1.2s ease-in-out infinite;
    }

    .cloud {
      animation: cloud-drift 12s linear infinite;
    }

    .cloud.slow {
      animation-duration: 19s;
      animation-direction: reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wing-pump {
      0%, 100% { transform: rotate(7deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes pedal-front {
      0%   { transform: rotate(28deg); }
      50%  { transform: rotate(-32deg); }
      100% { transform: rotate(28deg); }
    }

    @keyframes pedal-back {
      0%   { transform: rotate(-32deg); }
      50%  { transform: rotate(28deg); }
      100% { transform: rotate(-32deg); }
    }

    @keyframes pouch-sway {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(2px); }
    }

    @keyframes scroll-landscape {
      from { transform: translateX(0); }
      to { transform: translateX(-320px); }
    }

    @keyframes scroll-road {
      from { transform: translateX(0); }
      to { transform: translateX(-100px); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-40px); }
      to { transform: translateX(90px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1100 700" role="img" aria-label="一只鹈鹕正在骑自行车">
    <defs>
      <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9dd5c3"/>
        <stop offset="100%" stop-color="#5eab83"/>
      </linearGradient>

      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#263238" flood-opacity="0.18"/>
      </filter>
    </defs>

    <!-- 太阳与云 -->
    <circle cx="900" cy="105" r="50" fill="#fff1a8"/>
    <g class="cloud" opacity="0.9">
      <circle cx="120" cy="105" r="24" fill="white"/>
      <circle cx="148" cy="94" r="31" fill="white"/>
      <circle cx="180" cy="108" r="22" fill="white"/>
      <rect x="95" y="105" width="108" height="28" rx="14" fill="white"/>
    </g>

    <g class="cloud slow" opacity="0.75">
      <circle cx="700" cy="165" r="18" fill="white"/>
      <circle cx="722" cy="154" r="25" fill="white"/>
      <circle cx="752" cy="166" r="17" fill="white"/>
      <rect x="682" y="164" width="86" height="22" rx="11" fill="white"/>
    </g>

    <!-- 远景 -->
    <g class="landscape">
      <path d="M-200 400 L80 205 L300 400 L510 230 L760 400 L1010 205 L1300 400 Z"
            fill="url(#mountain)" opacity="0.9"/>
      <path d="M-200 430 Q10 370 220 425 T620 420 T1020 410 T1400 430 V510 H-200Z"
            fill="#72c46b"/>

      <!-- 树木 -->
      <g fill="#357a4e">
        <rect x="120" y="330" width="18" height="115" rx="8"/>
        <circle cx="129" cy="300" r="47"/>
        <rect x="450" y="340" width="16" height="105" rx="8"/>
        <circle cx="458" cy="313" r="42"/>
        <rect x="810" y="325" width="18" height="120" rx="8"/>
        <circle cx="819" cy="293" r="50"/>
        <rect x="1110" y="342" width="16" height="103" rx="8"/>
        <circle cx="1118" cy="315" r="40"/>
      </g>

      <g fill="#2f6e47" opacity="0.8">
        <circle cx="250" cy="408" r="18"/>
        <circle cx="278" cy="404" r="24"/>
        <circle cx="660" cy="410" r="25"/>
        <circle cx="690" cy="407" r="18"/>
        <circle cx="960" cy="405" r="24"/>
      </g>
    </g>

    <!-- 草地和道路 -->
    <rect y="440" width="1100" height="80" fill="#78cf67"/>
    <rect y="520" width="1100" height="180" fill="#4a5660"/>
    <rect y="520" width="1100" height="12" fill="#3d4851"/>

    <g class="road-dashes">
      <g fill="#fff5ae">
        <rect x="-60" y="610" width="66" height="12" rx="6"/>
        <rect x="50" y="610" width="66" height="12" rx="6"/>
        <rect x="160" y="610" width="66" height="12" rx="6"/>
        <rect x="270" y="610" width="66" height="12" rx="6"/>
        <rect x="380" y="610" width="66" height="12" rx="6"/>
        <rect x="490" y="610" width="66" height="12" rx="6"/>
        <rect x="600" y="610" width="66" height="12" rx="6"/>
        <rect x="710" y="610" width="66" height="12" rx="6"/>
        <rect x="820" y="610" width="66" height="12" rx="6"/>
        <rect x="930" y="610" width="66" height="12" rx="6"/>
        <rect x="1040" y="610" width="66" height="12" rx="6"/>
      </g>
    </g>

    <!-- 自行车 -->
    <g filter="url(#shadow)">
      <!-- 车轮 -->
      <g class="wheel">
        <circle cx="415" cy="535" r="78" fill="#263238"/>
        <circle cx="415" cy="535" r="64" fill="#e8f4f6"/>
        <circle cx="415" cy="535" r="8" fill="#263238"/>
        <g stroke="#78909c" stroke-width="3">
          <line x1="415" y1="471" x2="415" y2="599"/>
          <line x1="351" y1="535" x2="479" y2="535"/>
          <line x1="370" y1="490" x2="460" y2="580"/>
          <line x1="460" y1="490" x2="370" y2="580"/>
        </g>
      </g>

      <g class="wheel">
        <circle cx="690" cy="535" r="78" fill="#263238"/>
        <circle cx="690" cy="535" r="64" fill="#e8f4f6"/>
        <circle cx="690" cy="535" r="8" fill="#263238"/>
        <g stroke="#78909c" stroke-width="3">
          <line x1="690" y1="471" x2="690" y2="599"/>
          <line x1="626" y1="535" x2="754" y2="535"/>
          <line x1="645" y1="490" x2="735" y2="580"/>
          <line x1="735" y1="490" x2="645" y2="580"/>
        </g>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#e54b4b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M415 535 L500 385 L590 535 Z"/>
        <path d="M500 385 L625 405 L690 535"/>
        <path d="M590 535 L690 535"/>
        <path d="M625 405 L660 340"/>
        <path d="M650 340 L705 340"/>
        <path d="M500 385 L470 350"/>
      </g>

      <!-- 车把与座椅 -->
      <path d="M705 340 Q735 338 742 360" fill="none" stroke="#263238" stroke-width="10" stroke-linecap="round"/>
      <path d="M447 347 Q470 332 500 345" fill="none" stroke="#263238" stroke-width="13" stroke-linecap="round"/>

      <!-- 曲柄与脚踏 -->
      <g class="crank">
        <circle cx="590" cy="535" r="17" fill="#ffd166" stroke="#263238" stroke-width="5"/>
        <path d="M590 535 L628 558" stroke="#263238" stroke-width="7" stroke-linecap="round"/>
        <path d="M590 535 L552 512" stroke="#263238" stroke-width="7" stroke-linecap="round"/>
        <rect x="625" y="554" width="28" height="9" rx="4" fill="#263238"/>
        <rect x="527" y="507" width="28" height="9" rx="4" fill="#263238"/>
      </g>
    </g>

    <!-- 鹈鹕 -->
    <g class="pelican" filter="url(#shadow)">
      <!-- 后腿 -->
      <g class="leg-back">
        <path d="M565 405 Q590 450 550 510" fill="none" stroke="#f2a65a" stroke-width="18" stroke-linecap="round"/>
        <path d="M550 510 L532 514" fill="none" stroke="#f2a65a" stroke-width="15" stroke-linecap="round"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="515" cy="320" rx="130" ry="110" fill="#f7f7eb" stroke="#263238" stroke-width="7"/>
      <ellipse cx="505" cy="350" rx="80" ry="72" fill="#e8ece2"/>

      <!-- 翅膀 -->
      <g class="wing">
        <path d="M510 305
                 Q445 300 415 355
                 Q455 410 530 374
                 Q565 350 560 320 Z"
              fill="#5e8fab" stroke="#263238" stroke-width="7"/>
        <path d="M445 350 Q485 340 526 365" fill="none" stroke="#3d6f8e" stroke-width="7" stroke-linecap="round"/>
        <path d="M434 365 Q478 355 515 382" fill="none" stroke="#3d6f8e" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- 颈部与头 -->
      <path d="M545 290 Q550 180 655 185 Q720 190 718 260
               Q715 320 655 330 Q590 328 545 290 Z"
            fill="#f7f7eb" stroke="#263238" stroke-width="7"/>

      <!-- 鹈鹕喙 -->
      <path d="M642 238
               Q745 218 825 253
               Q760 275 665 275
               Q642 270 642 238 Z"
            fill="#f4a261" stroke="#263238" stroke-width="7" stroke-linejoin="round"/>

      <!-- 嘴袋 -->
      <g class="pouch">
        <path d="M666 275
                 Q760 278 802 262
                 Q777 340 687 335
                 Q652 322 666 275 Z"
              fill="#f7b267" stroke="#263238" stroke-width="7"/>
        <path d="M687 315 Q735 323 775 299" fill="none" stroke="#db8550" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- 眼睛 -->
      <circle cx="650" cy="220" r="16" fill="white" stroke="#263238" stroke-width="6"/>
      <circle cx="655" cy="223" r="6" fill="#263238"/>
      <path d="M630 195 Q653 180 676 196" fill="none" stroke="#263238" stroke-width="7" stroke-linecap="round"/>

      <!-- 前腿 -->
      <g class="leg-front">
        <path d="M525 400 Q555 455 628 558" fill="none" stroke="#f2a65a" stroke-width="18" stroke-linecap="round"/>
        <path d="M628 558 L646 558" fill="none" stroke="#f2a65a" stroke-width="15" stroke-linecap="round"/>
      </g>

      <!-- 手握车把 -->
      <path d="M602 330 Q635 347 675 343" fill="none" stroke="#f2a65a" stroke-width="18" stroke-linecap="round"/>
      <circle cx="676" cy="343" r="11" fill="#f2a65a" stroke="#263238" stroke-width="4"/>

      <!-- 尾羽 -->
      <path d="M410 322 Q362 305 340 346 Q385 365 435 350 Z"
            fill="#d7e4e5" stroke="#263238" stroke-width="7"/>
    </g>

    <!-- 地面阴影 -->
    <ellipse cx="555" cy="623" rx="230" ry="18" fill="#263238" opacity="0.18"/>
  </svg>
</body>
</html>
