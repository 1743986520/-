<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;background:#dff1ff;display:flex;align-items:center;justify-content:center;}
  svg{width:100%;max-width:960px;height:auto;display:block;}
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8dcff"/>
      <stop offset="100%" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee0a0"/>
      <stop offset="100%" stop-color="#79c168"/>
    </linearGradient>
    <radialGradient id="sunGrad">
      <stop offset="0%" stop-color="#fff8c4"/>
      <stop offset="100%" stop-color="#ffe066"/>
    </radialGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="688" cy="78" r="44" fill="url(#sunGrad)" opacity="0.95">
    <animate attributeName="r" values="44;48;44" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 云 ===== -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 0;-260 0" dur="24s" repeatCount="indefinite"/>
      <g transform="translate(0,78)">
        <ellipse cx="0" cy="0" rx="46" ry="20"/>
        <ellipse cx="38" cy="6" rx="32" ry="15"/>
        <ellipse cx="-36" cy="8" rx="28" ry="13"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 0;-260 0" dur="34s" repeatCount="indefinite" begin="-14s"/>
      <g transform="translate(0,152)">
        <ellipse cx="0" cy="0" rx="34" ry="16"/>
        <ellipse cx="28" cy="5" rx="24" ry="12"/>
        <ellipse cx="-26" cy="6" rx="20" ry="10"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 0;-260 0" dur="17s" repeatCount="indefinite" begin="-7s"/>
      <g transform="translate(0,42)">
        <ellipse cx="0" cy="0" rx="30" ry="14"/>
        <ellipse cx="24" cy="5" rx="20" ry="10"/>
        <ellipse cx="-22" cy="5" rx="18" ry="9"/>
      </g>
    </g>
  </g>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="435" width="800" height="65" fill="url(#groundGrad)"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#65b055" stroke-width="4"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#93d283" stroke-width="4"
        stroke-dasharray="18 26" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="0.45s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="478" x2="800" y2="478" stroke="#8dcb7d" stroke-width="5"
        stroke-dasharray="30 42" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- ===== 整个车+鸟（轻微颠簸） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -1.5;0 0;0 -1.5;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- ---------- 后轮 ---------- -->
    <g transform="translate(265,370)">
      <circle r="65" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="56" fill="none" stroke="#c9ced3" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="-38" y1="-38" x2="38" y2="38" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#b6bcc2" stroke-width="2"/>
        <circle cx="0" cy="-40" r="4.5" fill="#e63946"/>
      </g>
      <circle r="9" fill="#3a3a3a"/>
    </g>

    <!-- ---------- 前轮 ---------- -->
    <g transform="translate(545,370)">
      <circle r="65" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="56" fill="none" stroke="#c9ced3" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="-38" y1="-38" x2="38" y2="38" stroke="#b6bcc2" stroke-width="2"/>
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#b6bcc2" stroke-width="2"/>
        <circle cx="0" cy="-40" r="4.5" fill="#e63946"/>
      </g>
      <circle r="9" fill="#3a3a3a"/>
    </g>

    <!-- ---------- 链条 ---------- -->
    <line x1="395" y1="353" x2="265" y2="362" stroke="#9aa0a6" stroke-width="3"/>
    <line x1="395" y1="397" x2="265" y2="378" stroke="#9aa0a6" stroke-width="3"/>

    <!-- ---------- 车架 ---------- -->
    <g stroke="#e63946" stroke-width="9" fill="none" stroke-linecap="round">
      <line x1="395" y1="375" x2="502" y2="252"/>
      <line x1="345" y1="252" x2="500" y2="240"/>
      <line x1="395" y1="375" x2="345" y2="252"/>
      <line x1="265" y1="370" x2="395" y2="375"/>
      <line x1="265" y1="370" x2="345" y2="252"/>
    </g>
    <line x1="502" y1="252" x2="545" y2="370" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round"/>
    <line x1="500" y1="240" x2="503" y2="254" stroke="#3a3a3a" stroke-width="10" stroke-linecap="round"/>

    <!-- 车把 -->
    <line x1="502" y1="248" x2="506" y2="220" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 480,222 Q 506,210 532,224" stroke="#3a3a3a" stroke-width="8"
          fill="none" stroke-linecap="round"/>
    <circle cx="480" cy="222" r="5" fill="#2b2b2b"/>
    <circle cx="532" cy="224" r="5" fill="#2b2b2b"/>

    <!-- 牙盘 -->
    <circle cx="395" cy="375" r="24" fill="none" stroke="#7a8085" stroke-width="4"/>
    <circle cx="395" cy="375" r="24" fill="none" stroke="#b6bcc2" stroke-width="1.5"
            stroke-dasharray="3 5"/>

    <!-- 车座 -->
    <ellipse cx="345" cy="250" rx="36" ry="10" fill="#3a3a3a"/>

    <!-- ---------- 曲柄 + 脚踏（旋转） ---------- -->
    <g transform="translate(395,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-32" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="32" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
        <rect x="-10" y="-42" width="20" height="9" rx="3" fill="#2f2f2f"/>
        <rect x="-10" y="33" width="20" height="9" rx="3" fill="#2f2f2f"/>
      </g>
      <circle r="11" fill="#555"/>
    </g>

    <!-- ---------- 远侧腿（深色） ---------- -->
    <path fill="none" stroke="#c07f28" stroke-width="11" stroke-linecap="round"
          d="M332,236 Q360,312 395,407">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M332,236 Q360,312 395,407;
                M332,236 Q360,312 379,402.7;
                M332,236 Q360,312 367.3,391;
                M332,236 Q360,312 363,375;
                M332,236 Q360,312 367.3,359;
                M332,236 Q360,312 379,347.3;
                M332,236 Q360,312 395,343;
                M332,236 Q360,312 411,347.3;
                M332,236 Q360,312 422.7,359;
                M332,236 Q360,312 427,375;
                M332,236 Q360,312 422.7,391;
                M332,236 Q360,312 411,402.7;
                M332,236 Q360,312 395,407"/>
    </path>

    <!-- ---------- 近侧腿 ---------- -->
    <path fill="none" stroke="#f2a03d" stroke-width="12" stroke-linecap="round"
          d="M350,240 Q378,315 395,343">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M350,240 Q378,315 395,343;
                M350,240 Q378,315 411,347.3;
                M350,240 Q378,315 422.7,359;
                M350,240 Q378,315 427,375;
                M350,240 Q378,315 422.7,391;
                M350,240 Q378,315 411,402.7;
                M350,240 Q378,315 395,407;
                M350,240 Q378,315 379,402.7;
                M350,240 Q378,315 367.3,391;
                M350,240 Q378,315 363,375;
                M350,240 Q378,315 367.3,359;
                M350,240 Q378,315 379,347.3;
                M350,240 Q378,315 395,343"/>
    </path>

    <!-- ================= 鹈鹕 ================= -->
    <g>
      <!-- 尾巴 -->
      <path d="M 288,166 L 218,140 L 246,202 Z"
            fill="#fdf8ee" stroke="#e0d5c0" stroke-width="3" stroke-linejoin="round"/>

      <!-- 脖子 -->
      <path d="M 350,162 C 366,114 398,88 428,80 L 452,110 C 420,124 400,162 390,202 Z"
            fill="#fdf8ee" stroke="#e0d5c0" stroke-width="3" stroke-linejoin="round"/>

      <!-- 喉囊 -->
      <path d="M 456,104 C 468,188 552,192 590,124 Z"
            fill="#f9cf6b" stroke="#e0a83a" stroke-width="3" stroke-linejoin="round"/>

      <!-- 喙 -->
      <path d="M 452,76 L 590,104 Q 601,114 590,124 L 454,104 Z"
            fill="#f5a623" stroke="#d98b12" stroke-width="3" stroke-linejoin="round"/>
      <line x1="470" y1="104" x2="574" y2="116" stroke="#d98b12" stroke-width="2" opacity="0.7"/>

      <!-- 头 -->
      <ellipse cx="442" cy="96" rx="31" ry="28"
               fill="#fdf8ee" stroke="#e0d5c0" stroke-width="3"/>

      <!-- 眼睛 -->
      <circle cx="457" cy="84" r="7.5" fill="#2b2b2b"/>
      <circle cx="459.5" cy="81" r="2.6" fill="#ffffff"/>

      <!-- 身体 -->
      <ellipse cx="330" cy="194" rx="64" ry="48"
               fill="#fdf8ee" stroke="#e0d5c0" stroke-width="3"
               transform="rotate(-8 330 194)"/>

      <!-- 翅膀 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-3 330 194;3 330 194;-3 330 194" dur="1s" repeatCount="indefinite"/>
        <path d="M 296,164 Q 342,146 382,180 Q 368,226 316,230 Q 288,198 296,164 Z"
              fill="#f1e7d3" stroke="#dccdb2" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 312,186 Q 336,196 362,196" fill="none" stroke="#dccdb2"
              stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 308,204 Q 332,214 356,212" fill="none" stroke="#dccdb2"
              stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

  </g>
</svg>

</body>
</html>
